<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="pillRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="pillWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Rotated Pill Capsule -->
  <g transform="rotate(-45 24 24)">
    <rect x="14" y="6" width="20" height="18" rx="10" fill="url(#pillRed)"/>
    <rect x="14" y="24" width="20" height="18" rx="10" fill="url(#pillWhite)"/>
    <!-- Center divider line -->
    <line x1="14" y1="24" x2="34" y2="24" stroke="#64748b" stroke-width="1"/>
    <!-- Shine highlight -->
    <path d="M17 10 Q19 8 23 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
