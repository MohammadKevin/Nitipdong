<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Card Base -->
  <rect x="4" y="9" width="40" height="30" rx="4" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- Magnetic Stripe -->
  <rect x="4" y="16" width="40" height="6" fill="#1e293b"/>
  <!-- Chip -->
  <rect x="9" y="26" width="7" height="6" rx="1" fill="#fbbf24"/>
  <!-- Hologram circles -->
  <circle cx="34" cy="29" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="38" cy="29" r="4" fill="#f59e0b" opacity="0.8"/>
</svg>
