<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0B6E86"/>
    </linearGradient>
  </defs>

  <!-- the N, drawn as one continuous folded ribbon -->
  <path d="M17,52 L17,19 L47,52 L47,19"
        fill="none" stroke="url(#ribbon)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tag-knot ring: the ribbon's end loops into a punched tag hole -->
  <circle cx="17" cy="12" r="6.4" fill="none" stroke="#0C1E2B" stroke-width="3.2"/>
</svg>
