name: Build Flutter Android APK

on:
  push:
    paths:
      - 'nitipdong_mobile/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 💙 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: ⚙️ Setup Android Platform Scaffold & Dependencies
        run: |
          cd nitipdong_mobile
          flutter create --platforms=android --org=com.nitipdong .
          flutter pub get
          flutter pub run flutter_launcher_icons || true

      - name: 🔨 Build Android Release APK
        run: |
          cd nitipdong_mobile
          flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NitipDong-Release-APK
          path: nitipdong_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
