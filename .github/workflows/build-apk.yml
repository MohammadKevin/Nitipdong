name: Build Flutter Android APK

on:
  push:
    paths:
      - 'nitipdong_mobile/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # Required for creating GitHub Releases

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 💙 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: ⚙️ Setup Android Dependencies
        run: |
          cd nitipdong_mobile
          flutter pub get

      - name: 🔨 Build Android Release APK
        run: |
          cd nitipdong_mobile
          flutter build apk --release --no-tree-shake-icons

      - name: 📋 Rename APK
        run: |
          cp nitipdong_mobile/build/app/outputs/flutter-apk/app-release.apk NitipDong-latest.apk

      - name: 📤 Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NitipDong-Release-APK
          path: NitipDong-latest.apk
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "NitipDong App — Latest Build"
          body: |
            ## 📱 NitipDong Android App

            **Build otomatis** dari commit terbaru di branch `main`.

            ### Cara Install:
            1. Download file `NitipDong-latest.apk` di bawah
            2. Aktifkan *Sumber Tidak Dikenal* di Pengaturan HP
            3. Buka file APK → Install → Selesai! 🎉

            ### Persyaratan:
            - Android 5.0 (Lollipop) ke atas
            - Koneksi internet aktif

          files: NitipDong-latest.apk
          prerelease: false
          make_latest: true

      - name: 🌐 Deploy APK Directly to DomaiNesia Server
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          source: "NitipDong-latest.apk"
          target: "/home/${{ secrets.CPANEL_USER }}/public_html/downloads/"

      - name: ⚙️ Setup Symlink & Permissions on DomaiNesia
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script: |
            mkdir -p /home/${{ secrets.CPANEL_USER }}/public_html/downloads
            mkdir -p /home/${{ secrets.CPANEL_USER }}/laravel_app/public/downloads
            cp -f /home/${{ secrets.CPANEL_USER }}/public_html/downloads/NitipDong-latest.apk /home/${{ secrets.CPANEL_USER }}/public_html/downloads/nitipdong.apk 2>/dev/null || true
            cp -f /home/${{ secrets.CPANEL_USER }}/public_html/downloads/NitipDong-latest.apk /home/${{ secrets.CPANEL_USER }}/laravel_app/public/downloads/nitipdong.apk 2>/dev/null || true
            chmod 644 /home/${{ secrets.CPANEL_USER }}/public_html/downloads/*
