name: Deploy BelanjaIn to DomaiNesia

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, sodium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PHP Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install Frontend Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Sync Laravel App Files via Rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_USER }}
          REMOTE_PORT: ${{ secrets.CPANEL_PORT || 22 }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "."
          TARGET: "/home/${{ secrets.CPANEL_USER }}/laravel_app"
          EXCLUDE: "/.git/, /.github/, /storage/, /node_modules/, .env"

      - name: Post-Deployment Steps on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            echo "🚀 Finalizing Deployment..."
            cd /home/${{ secrets.CPANEL_USER }}/laravel_app || exit 1

            # 1. Pastikan permission folder tepat
            chmod -R 775 storage bootstrap/cache

            # 2. Salin seluruh isi public (gambar, css, js, build) ke public_html
            cp -rf public/* /home/${{ secrets.CPANEL_USER }}/public_html/ 2>/dev/null || true
            cp -rf public/.* /home/${{ secrets.CPANEL_USER }}/public_html/ 2>/dev/null || true

            # 3. Hubungkan symlink storage
            rm -f /home/${{ secrets.CPANEL_USER }}/public_html/storage
            ln -sfn /home/${{ secrets.CPANEL_USER }}/laravel_app/storage/app/public /home/${{ secrets.CPANEL_USER }}/public_html/storage

            # 4. Jalankan migrasi, seeder dan bersihkan cache
            php artisan migrate --force
            php artisan db:seed --force
            php artisan optimize:clear

            echo "✅ Deployment Successful & Live!"