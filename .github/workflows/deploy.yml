name: Deploy BelanjaIn to DomaiNesia

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, sodium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PHP Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install Frontend Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Deploy and Sync to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            echo "🚀 Starting Automated Deployment on Server..."
            cd /home/${{ secrets.CPANEL_USER }}/laravel_app || exit 1
            
            # Pull update terbaru dari GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Pastikan permission folder tepat
            chmod -R 775 storage bootstrap/cache
            
            # Salin asset public ke public_html
            cp -a public/. /home/${{ secrets.CPANEL_USER }}/public_html/
            
            # Buat / pastikan symlink storage terhubung
            rm -f /home/${{ secrets.CPANEL_USER }}/public_html/storage
            ln -sfn /home/${{ secrets.CPANEL_USER }}/laravel_app/storage/app/public /home/${{ secrets.CPANEL_USER }}/public_html/storage
            
            # Jalankan migrasi dan optimize
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            
            echo "✅ Deployment Successful & Live!"