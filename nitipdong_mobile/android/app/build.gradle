plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.nitipdong.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.nitipdong.app"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def kFile = null
            if (keystorePropertiesFile.exists() && keystoreProperties.containsKey('storeFile')) {
                def sf = keystoreProperties['storeFile']
                if (file(sf).exists()) {
                    kFile = file(sf)
                } else if (rootProject.file(sf).exists()) {
                    kFile = rootProject.file(sf)
                } else if (file("app/${sf}").exists()) {
                    kFile = file("app/${sf}")
                }
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storePassword = keystoreProperties['storePassword']
            } else if (file('nitipdong-keystore.jks').exists()) {
                kFile = file('nitipdong-keystore.jks')
                keyAlias = 'nitipdong'
                keyPassword = 'nitipdong123'
                storePassword = 'nitipdong123'
            } else if (rootProject.file('nitipdong-keystore.jks').exists()) {
                kFile = rootProject.file('nitipdong-keystore.jks')
                keyAlias = 'nitipdong'
                keyPassword = 'nitipdong123'
                storePassword = 'nitipdong123'
            }

            if (kFile != null && kFile.exists()) {
                storeFile = kFile
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
